<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vlogger Image Cycler</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Hide scrollbars completely for clean screen capture */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Image transitions */
        .slide-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0;
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
            transform: scale(0.98);
            pointer-events: none;
        }

        .slide-image.active {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        /* UI auto-fade handling */
        .auto-hide {
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .auto-hide.hidden-ui {
            opacity: 0 !important;
            transform: translateY(10px);
            pointer-events: none !important;
        }

        /* Drag & Drop Overlay highlight */
        .drag-over {
            border: 3px dashed #3b82f6 !important;
            background-color: rgba(15, 23, 42, 0.95) !important;
        }

        /* Custom scrollbar for playlist modal */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.2);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,0.4);
        }
    </style>
</head>
<body class="bg-black text-white relative flex items-center justify-center">

    <!-- Primary Image Container -->
    <div id="image-container" class="relative w-full h-full flex items-center justify-center cursor-pointer">
        <!-- Images injected dynamically here -->
    </div>

    <!-- Empty State / Dropzone Overlay (Visible when no images are loaded) -->
    <div id="drop-zone" class="absolute inset-0 flex flex-col items-center justify-center bg-zinc-950/90 z-20 transition-all p-6 text-center">
        <div class="max-w-xl w-full border-2 border-dashed border-zinc-700 hover:border-blue-500 rounded-2xl p-8 md:p-12 transition-all bg-zinc-900/50 backdrop-blur-md shadow-2xl">
            <div class="w-16 h-16 bg-blue-600/20 text-blue-400 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                <i class="fa-solid fa-folder-open"></i>
            </div>
            <h1 class="text-2xl md:text-3xl font-bold mb-2 tracking-tight">Vlogger Image Cycler</h1>
            <p class="text-zinc-400 text-sm md:text-base mb-6 leading-relaxed">
                Drag & drop your local image folder (or selected image files) anywhere onto the screen, or use the buttons below.
            </p>

            <div class="flex flex-col sm:flex-row gap-3 justify-center items-center mb-6">
                <!-- Select Folder Input -->
                <label class="w-full sm:w-auto px-5 py-3 bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white font-medium rounded-xl cursor-pointer transition flex items-center justify-center gap-2 shadow-lg shadow-blue-600/20">
                    <i class="fa-solid fa-folder"></i>
                    <span>Select Local Folder</span>
                    <input type="file" id="folder-input" webkitdirectory directory multiple accept="image/png, image/jpeg, image/jpg, image/webp" class="hidden">
                </label>

                <!-- Select Files Input -->
                <label class="w-full sm:w-auto px-5 py-3 bg-zinc-800 hover:bg-zinc-700 active:bg-zinc-900 text-zinc-200 font-medium rounded-xl cursor-pointer transition border border-zinc-700 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-images"></i>
                    <span>Select Image Files</span>
                    <input type="file" id="file-input" multiple accept="image/png, image/jpeg, image/jpg, image/webp" class="hidden">
                </label>
            </div>

            <!-- Fallback relative path loader for local directory structure -->
            <div class="pt-4 border-t border-zinc-800">
                <p class="text-xs text-zinc-500 mb-2">Or load default batch from local <code class="text-zinc-400 bg-zinc-800 px-1.5 py-0.5 rounded">/images/</code> folder:</p>
                <div class="flex gap-2 max-w-md mx-auto">
                    <input type="text" id="manual-prefix" value="images/album" placeholder="e.g. images/album" class="bg-zinc-800 border border-zinc-700 text-xs text-zinc-200 rounded-lg px-3 py-2 flex-grow focus:outline-none focus:border-blue-500">
                    <button id="btn-load-fallback" class="bg-zinc-700 hover:bg-zinc-600 text-xs px-3 py-2 rounded-lg font-medium transition">
                        Load Sequential (1-10)
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Top Overlay Control Bar -->
    <div id="top-bar" class="auto-hide absolute top-4 left-1/2 -translate-x-1/2 z-30 bg-zinc-900/80 backdrop-blur-md border border-zinc-800/80 rounded-2xl px-5 py-2.5 flex items-center gap-4 shadow-2xl text-xs md:text-sm">
        <div class="flex items-center gap-2 text-zinc-400 border-r border-zinc-800 pr-4">
            <i class="fa-regular fa-image text-blue-400"></i>
            <span id="counter-text" class="font-mono text-zinc-200">0 / 0</span>
        </div>

        <!-- Playback State Controls -->
        <div class="flex items-center gap-1.5">
            <button id="btn-prev" title="Previous (Left Arrow)" class="p-2 hover:bg-zinc-800 rounded-lg text-zinc-300 hover:text-white transition">
                <i class="fa-solid fa-backward-step"></i>
            </button>
            <button id="btn-play-pause" title="Play / Pause (Spacebar)" class="p-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg transition w-8 h-8 flex items-center justify-center">
                <i id="play-icon" class="fa-solid fa-play"></i>
            </button>
            <button id="btn-next" title="Next (Right Arrow)" class="p-2 hover:bg-zinc-800 rounded-lg text-zinc-300 hover:text-white transition">
                <i class="fa-solid fa-forward-step"></i>
            </button>
        </div>

        <div class="h-4 w-px bg-zinc-800"></div>

        <!-- Speed Selector -->
        <div class="flex items-center gap-2">
            <i class="fa-regular fa-clock text-zinc-400"></i>
            <select id="timer-select" class="bg-zinc-800 border border-zinc-700 rounded-lg px-2 py-1 text-xs text-zinc-200 focus:outline-none cursor-pointer">
                <option value="0">Manual</option>
                <option value="2000">2s</option>
                <option value="3000" selected>3s</option>
                <option value="5000">5s</option>
                <option value="10000">10s</option>
                <option value="15000">15s</option>
            </select>
        </div>

        <div class="h-4 w-px bg-zinc-800"></div>

        <!-- Action Buttons -->
        <div class="flex items-center gap-1">
            <!-- Open Playlist / Reload Folder -->
            <button id="btn-playlist" title="Playlist / Change Folder" class="p-2 hover:bg-zinc-800 rounded-lg text-zinc-300 hover:text-white transition">
                <i class="fa-solid fa-list text-xs"></i>
            </button>

            <!-- Toggle Fullscreen -->
            <button id="btn-fullscreen" title="Toggle Fullscreen (F)" class="p-2 hover:bg-zinc-800 rounded-lg text-zinc-300 hover:text-white transition">
                <i class="fa-solid fa-expand text-xs"></i>
            </button>

            <!-- Hide UI manually -->
            <button id="btn-hide-ui" title="Hide UI Controls (H)" class="p-2 hover:bg-zinc-800 rounded-lg text-zinc-300 hover:text-white transition">
                <i class="fa-solid fa-eye-slash text-xs"></i>
            </button>
        </div>
    </div>

    <!-- Quick Keyboard Shortcut Hint overlay (Bottom Left) -->
    <div id="bottom-hint" class="auto-hide absolute bottom-4 left-4 z-30 bg-zinc-900/60 backdrop-blur-sm border border-zinc-800/60 rounded-xl px-3 py-1.5 text-[11px] text-zinc-400 flex items-center gap-3">
        <span><kbd class="bg-zinc-800 text-zinc-200 px-1.5 py-0.5 rounded border border-zinc-700">Space</kbd> Play/Pause</span>
        <span><kbd class="bg-zinc-800 text-zinc-200 px-1.5 py-0.5 rounded border border-zinc-700">←</kbd> <kbd class="bg-zinc-800 text-zinc-200 px-1.5 py-0.5 rounded border border-zinc-700">→</kbd> Cycle</span>
        <span><kbd class="bg-zinc-800 text-zinc-200 px-1.5 py-0.5 rounded border border-zinc-700">H</kbd> Hide Controls</span>
        <span><kbd class="bg-zinc-800 text-zinc-200 px-1.5 py-0.5 rounded border border-zinc-700">F</kbd> Fullscreen</span>
    </div>

    <!-- Playlist Drawer / Modal -->
    <div id="playlist-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-40 hidden flex items-center justify-center p-4">
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl w-full max-w-lg max-h-[80vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="p-4 border-b border-zinc-800 flex justify-between items-center">
                <h3 class="font-semibold text-zinc-100 flex items-center gap-2">
                    <i class="fa-solid fa-images text-blue-400"></i> Loaded Images
                </h3>
                <button id="btn-close-playlist" class="text-zinc-400 hover:text-white p-1 rounded-lg">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <div id="playlist-items" class="p-4 overflow-y-auto space-y-2 flex-grow">
                <!-- Items populated dynamically -->
            </div>

            <div class="p-4 border-t border-zinc-800 bg-zinc-950/50 flex justify-between items-center">
                <label class="text-xs text-blue-400 hover:underline cursor-pointer flex items-center gap-1">
                    <i class="fa-solid fa-plus"></i> Add More / Change Folder
                    <input type="file" id="modal-folder-input" webkitdirectory directory multiple accept="image/*" class="hidden">
                </label>
                <button id="btn-clear-all" class="text-xs text-red-400 hover:text-red-300">Clear All</button>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 bg-zinc-800 text-white border border-zinc-700 px-4 py-2.5 rounded-xl shadow-2xl text-xs flex items-center gap-2 opacity-0 transition-opacity duration-300 pointer-events-none">
        <i id="toast-icon" class="fa-solid fa-info-circle text-blue-400"></i>
        <span id="toast-msg">Notification</span>
    </div>

    <script>
        // App State Variables
        let imageList = []; // Array of object URLs or file paths
        let currentIndex = 0;
        let isPlaying = false;
        let timerInterval = null;
        let intervalTime = 3000; // default 3s
        let idleTimer = null;
        let isUIVisible = true;

        // DOM Elements
        const container = document.getElementById('image-container');
        const dropZone = document.getElementById('drop-zone');
        const folderInput = document.getElementById('folder-input');
        const fileInput = document.getElementById('file-input');
        const modalFolderInput = document.getElementById('modal-folder-input');
        const counterText = document.getElementById('counter-text');
        const btnPlayPause = document.getElementById('btn-play-pause');
        const playIcon = document.getElementById('play-icon');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const timerSelect = document.getElementById('timer-select');
        const btnFullscreen = document.getElementById('btn-fullscreen');
        const btnHideUI = document.getElementById('btn-hide-ui');
        const btnPlaylist = document.getElementById('btn-playlist');
        const playlistModal = document.getElementById('playlist-modal');
        const btnClosePlaylist = document.getElementById('btn-close-playlist');
        const playlistItems = document.getElementById('playlist-items');
        const btnClearAll = document.getElementById('btn-clear-all');
        const topBar = document.getElementById('top-bar');
        const bottomHint = document.getElementById('bottom-hint');
        const manualPrefixInput = document.getElementById('manual-prefix');
        const btnLoadFallback = document.getElementById('btn-load-fallback');

        // Supported Image Extensions
        const VALID_EXTENSIONS = ['png', 'jpg', 'jpeg', 'webp', 'svg', 'gif'];

        // --- Initialization & Event Listeners ---
        function init() {
            setupDragAndDrop();
            setupInputs();
            setupControls();
            setupKeyboard();
            setupActivityTracker();
        }

        // Handle File Loading & Parsing
        function handleFiles(files) {
            const validFiles = Array.from(files).filter(file => {
                const ext = file.name.split('.').pop().toLowerCase();
                return VALID_EXTENSIONS.includes(ext);
            });

            if (validFiles.length === 0) {
                showToast('No valid .png, .jpg, or .webp images found.', 'fa-triangle-exclamation text-amber-400');
                return;
            }

            // Sort files naturally by filename (e.g., album1, album2, album10)
            validFiles.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));

            // Clean existing object URLs to free memory
            imageList.forEach(item => {
                if (item.isObjectUrl) URL.revokeObjectURL(item.url);
            });

            // Create object URLs
            imageList = validFiles.map(file => ({
                name: file.name,
                url: URL.createObjectURL(file),
                isObjectUrl: true
            }));

            currentIndex = 0;
            renderImages();
            dropZone.classList.add('hidden');
            showToast(`Successfully loaded ${imageList.length} images`, 'fa-circle-check text-green-400');
            
            // Auto start timer if set
            if (intervalTime > 0) {
                startSlideshow();
            }
        }

        // Setup Drag & Drop behavior across window
        function setupDragAndDrop() {
            window.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.remove('hidden');
                dropZone.classList.add('drag-over');
            });

            window.addEventListener('dragleave', (e) => {
                if (e.clientX === 0 && e.clientY === 0) {
                    dropZone.classList.remove('drag-over');
                    if (imageList.length > 0) dropZone.classList.add('hidden');
                }
            });

            window.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('drag-over');
                
                if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                    handleFiles(e.dataTransfer.files);
                }
            });
        }

        // Setup HTML File Inputs
        function setupInputs() {
            folderInput.addEventListener('change', (e) => handleFiles(e.target.files));
            fileInput.addEventListener('change', (e) => handleFiles(e.target.files));
            modalFolderInput.addEventListener('change', (e) => {
                handleFiles(e.target.files);
                playlistModal.classList.add('hidden');
            });

            // Fallback relative loader (e.g. for images/album1.png, album2.png, etc.)
            btnLoadFallback.addEventListener('click', () => {
                const prefix = manualPrefixInput.value.trim();
                if (!prefix) return;

                const fallbackItems = [];
                // Check common extensions for sequential naming
                const extensions = ['png', 'jpg', 'jpeg', 'webp'];
                
                // Construct fallback URLs
                for (let i = 1; i <= 10; i++) {
                    extensions.forEach(ext => {
                        fallbackItems.push({
                            name: `${prefix}${i}.${ext}`,
                            url: `${prefix}${i}.${ext}`,
                            isObjectUrl: false
                        });
                    });
                }

                imageList = fallbackItems;
                currentIndex = 0;
                renderImages();
                dropZone.classList.add('hidden');
                showToast('Loaded fallback paths. Cycle with arrow keys.', 'fa-info-circle text-blue-400');
            });
        }

        // Render DOM Image elements
        function renderImages() {
            container.innerHTML = '';

            if (imageList.length === 0) {
                counterText.textContent = `0 / 0`;
                dropZone.classList.remove('hidden');
                stopSlideshow();
                return;
            }

            imageList.forEach((imgObj, idx) => {
                const imgEl = document.createElement('img');
                imgEl.src = imgObj.url;
                imgEl.alt = imgObj.name;
                imgEl.className = `slide-image ${idx === currentIndex ? 'active' : ''}`;
                
                // Fallback error handler for relative non-existent images
                imgEl.onerror = () => {
                    if (!imgObj.isObjectUrl) {
                        // Remove invalid fallback image silently
                        imgEl.remove();
                    }
                };

                container.appendChild(imgEl);
            });

            updateCounter();
        }

        // Update Counter Display
        function updateCounter() {
            if (imageList.length === 0) {
                counterText.textContent = `0 / 0`;
                return;
            }
            counterText.textContent = `${currentIndex + 1} / ${imageList.length}`;
        }

        // Slide Navigation
        function showSlide(index) {
            if (imageList.length === 0) return;

            const slides = container.querySelectorAll('.slide-image');
            if (slides.length === 0) return;

            // Handle looping
            if (index >= imageList.length) {
                currentIndex = 0;
            } else if (index < 0) {
                currentIndex = imageList.length - 1;
            } else {
                currentIndex = index;
            }

            slides.forEach((slide, idx) => {
                if (idx === currentIndex) {
                    slide.classList.add('active');
                } else {
                    slide.classList.remove('active');
                }
            });

            updateCounter();
        }

        function nextSlide() {
            showSlide(currentIndex + 1);
        }

        function prevSlide() {
            showSlide(currentIndex - 1);
        }

        // Timer and Playback Control
        function startSlideshow() {
            if (intervalTime <= 0 || imageList.length === 0) return;
            stopSlideshow();
            isPlaying = true;
            playIcon.className = 'fa-solid fa-pause';
            timerInterval = setInterval(() => {
                nextSlide();
            }, intervalTime);
        }

        function stopSlideshow() {
            isPlaying = false;
            playIcon.className = 'fa-solid fa-play';
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function togglePlay() {
            if (isPlaying) {
                stopSlideshow();
                showToast('Paused', 'fa-pause text-yellow-400');
            } else {
                if (intervalTime === 0) {
                    // Default to 3s if currently manual
                    intervalTime = 3000;
                    timerSelect.value = '3000';
                }
                startSlideshow();
                showToast('Auto cycling started', 'fa-play text-green-400');
            }
        }

        // Setup Controls
        function setupControls() {
            btnPlayPause.addEventListener('click', (e) => {
                e.stopPropagation();
                togglePlay();
            });

            btnNext.addEventListener('click', (e) => {
                e.stopPropagation();
                nextSlide();
            });

            btnPrev.addEventListener('click', (e) => {
                e.stopPropagation();
                prevSlide();
            });

            // Clicking main container steps forward
            container.addEventListener('click', () => {
                if (imageList.length > 0) {
                    nextSlide();
                }
            });

            timerSelect.addEventListener('change', (e) => {
                intervalTime = parseInt(e.target.value, 10);
                if (intervalTime > 0) {
                    startSlideshow();
                } else {
                    stopSlideshow();
                }
            });

            btnFullscreen.addEventListener('click', (e) => {
                e.stopPropagation();
                toggleFullscreen();
            });

            btnHideUI.addEventListener('click', (e) => {
                e.stopPropagation();
                hideUI();
            });

            // Playlist Modal Handlers
            btnPlaylist.addEventListener('click', (e) => {
                e.stopPropagation();
                openPlaylistModal();
            });

            btnClosePlaylist.addEventListener('click', () => {
                playlistModal.classList.add('hidden');
            });

            btnClearAll.addEventListener('click', () => {
                imageList.forEach(item => {
                    if (item.isObjectUrl) URL.revokeObjectURL(item.url);
                });
                imageList = [];
                renderImages();
                playlistModal.classList.add('hidden');
                showToast('Cleared image list', 'fa-trash text-red-400');
            });
        }

        // Open Playlist Modal with current list items
        function openPlaylistModal() {
            playlistItems.innerHTML = '';
            if (imageList.length === 0) {
                playlistItems.innerHTML = `<p class="text-zinc-500 text-sm text-center py-6">No images loaded yet.</p>`;
            } else {
                imageList.forEach((item, idx) => {
                    const row = document.createElement('div');
                    row.className = `flex items-center justify-between p-2 rounded-xl border ${idx === currentIndex ? 'bg-blue-600/20 border-blue-500/50 text-white' : 'bg-zinc-800/50 border-zinc-700/50 text-zinc-300 hover:bg-zinc-800'} cursor-pointer transition`;
                    row.innerHTML = `
                        <div class="flex items-center gap-3 overflow-hidden">
                            <span class="text-xs font-mono text-zinc-500 w-5 text-right">${idx + 1}</span>
                            <img src="${item.url}" class="w-10 h-10 object-cover rounded-lg bg-black" />
                            <span class="text-xs font-medium truncate max-w-[240px]">${item.name}</span>
                        </div>
                        <button class="text-zinc-500 hover:text-red-400 p-1.5 rounded-lg text-xs" title="Remove">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    `;

                    // Click item to jump
                    row.addEventListener('click', (e) => {
                        if (e.target.closest('button')) return; // handled below
                        currentIndex = idx;
                        showSlide(currentIndex);
                        playlistModal.classList.add('hidden');
                    });

                    // Remove item
                    row.querySelector('button').addEventListener('click', (e) => {
                        e.stopPropagation();
                        if (item.isObjectUrl) URL.revokeObjectURL(item.url);
                        imageList.splice(idx, 1);
                        if (currentIndex >= imageList.length) currentIndex = Math.max(0, imageList.length - 1);
                        renderImages();
                        openPlaylistModal(); // Refresh modal
                    });

                    playlistItems.appendChild(row);
                });
            }

            playlistModal.classList.remove('hidden');
        }

        // Toggle Screen Fullscreen
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch((err) => {
                    showToast(`Fullscreen error: ${err.message}`, 'fa-exclamation-circle text-red-400');
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // Keyboard Controls
        function setupKeyboard() {
            window.addEventListener('keydown', (e) => {
                // Prevent interference when typing in inputs
                if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

                switch (e.key) {
                    case 'ArrowRight':
                    case ' ': // Spacebar
                        e.preventDefault();
                        nextSlide();
                        resetIdleTimer();
                        break;
                    case 'ArrowLeft':
                        e.preventDefault();
                        prevSlide();
                        resetIdleTimer();
                        break;
                    case 'f':
                    case 'F':
                        e.preventDefault();
                        toggleFullscreen();
                        break;
                    case 'h':
                    case 'H':
                        e.preventDefault();
                        if (isUIVisible) {
                            hideUI();
                        } else {
                            showUI();
                        }
                        break;
                }
            });
        }

        // Auto-Hide Controls UI when idle (for clean Screen Captures)
        function setupActivityTracker() {
            const handleActivity = () => {
                showUI();
                resetIdleTimer();
            };

            window.addEventListener('mousemove', handleActivity);
            window.addEventListener('mousedown', handleActivity);
            window.addEventListener('touchstart', handleActivity);

            resetIdleTimer();
        }

        function resetIdleTimer() {
            clearTimeout(idleTimer);
            idleTimer = setTimeout(() => {
                hideUI();
            }, 3000); // Auto-hide UI controls after 3 seconds of inactivity
        }

        function showUI() {
            isUIVisible = true;
            topBar.classList.remove('hidden-ui');
            bottomHint.classList.remove('hidden-ui');
            document.body.style.cursor = 'default';
        }

        function hideUI() {
            isUIVisible = false;
            topBar.classList.add('hidden-ui');
            bottomHint.classList.add('hidden-ui');
            document.body.style.cursor = 'none'; // Hide cursor for clean OBS capture
        }

        // Helper Toast Notification
        function showToast(msg, iconClass = 'fa-info-circle text-blue-400') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            const toastIcon = document.getElementById('toast-icon');

            toastMsg.textContent = msg;
            toastIcon.className = `fa-solid ${iconClass}`;
            
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');

            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 2500);
        }

        // Initialize App on DOM load
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
